<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelly Mario</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
            min-height: 100vh;
            overflow-x: hidden;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            color: #666;
            margin-top: 4px;
        }

        main {
            display: flex;
            gap: 16px;
        }

        /* 画布区域 */
        .canvas-wrap {
            flex: 2;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
            background: #fff;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 460px;
        }
        .hint {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,.7);
            backdrop-filter: blur(6px);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 13px;
        }
        #score {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,.7);
            backdrop-filter: blur(6px);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 13px;
        }

        /* 控制面板 */
        .controls {
            flex: 1;
            min-width: 240px;
            background: rgba(255,255,255,.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
        }
        .controls h2 {
            font-size: 16px;
            margin-bottom: 12px;
        }
        .ctrl-group {
            margin-bottom: 14px;
        }
        .ctrl-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 4px;
        }
        .ctrl-group input[type=range] {
            width: 100%;
            accent-color: #4f46e5;
        }
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .actions button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: filter .15s;
        }
        .actions button:hover { filter: brightness(.92); }
        .btn-reset { background: #fee2e2; color: #dc2626; }
        .btn-debug { background: #dbeafe; color: #2563eb; }

        @media (max-width: 768px) {
            main { flex-direction: column; }
            .controls { min-width: auto; }
        }

        /* 手机虚拟按键 */
        .gamepad {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 16px 20px 28px;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 100;
            pointer-events: none;
        }
        .gamepad button {
            pointer-events: auto;
            border: none;
            border-radius: 50%;
            width: 60px; height: 60px;
            font-size: 22px;
            background: rgba(0,0,0,.25);
            color: #fff;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            transition: background .1s;
        }
        .gamepad button:active, .gamepad button.pressed {
            background: rgba(79,70,229,.6);
        }
        .gamepad .dpad {
            display: flex;
            gap: 12px;
        }
        .gamepad .jump-btn {
            width: 72px; height: 72px;
            font-size: 26px;
        }
        @media (hover: none) and (pointer: coarse) {
            .gamepad { display: flex; }
            .hint { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Jelly Mario</h1>
            <p>方向键 / WASD 移动，空格跳跃，收集星星！</p>
        </header>

        <main>
            <div class="canvas-wrap">
                <canvas id="gameCanvas"></canvas>
                <div class="hint">← → ↑ / WASD / Space</div>
                <div id="score">Score: 0</div>
            </div>

            <!-- 手机虚拟按键 -->
            <div class="gamepad" id="gamepad">
                <div class="dpad">
                    <button id="pad-left">◀</button>
                    <button id="pad-right">▶</button>
                </div>
                <button class="jump-btn" id="pad-jump">▲</button>
            </div>

            <div class="controls">
                <h2>⚙ 参数调节</h2>
                <div class="ctrl-group">
                    <label>弹簧刚度 (Stiffness)</label>
                    <input type="range" id="stiffness" min="0.01" max="1" step="0.005" value="0.08">
                </div>
                <div class="ctrl-group">
                    <label>重力 (Gravity)</label>
                    <input type="range" id="gravity" min="0.001" max="1" step="0.05" value="0.06">
                </div>
                <div class="ctrl-group">
                    <label>跳跃力 (Jump)</label>
                    <input type="range" id="jumpStrength" min="0.5" max="20" step="0.1" value="12">
                </div>
                <div class="actions">
                    <button class="btn-reset" id="resetGame">↻ 重置</button>
                    <button class="btn-debug" id="toggleDebug">🐛 调试</button>
                </div>
            </div>
        </main>
    </div>

    <script>
    // ========== 工具 ==========
    function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi) }

    // ========== 质点 ==========
    class Particle {
        constructor(x, y) {
            this.x = x; this.y = y
            this.ox = x; this.oy = y // old position (Verlet)
            this.r = 5
            this.onGround = false
        }
        update(dt, gravity, damping) {
            const vx = (this.x - this.ox) * (1 - damping)
            const vy = (this.y - this.oy) * (1 - damping)
            const maxV = 5
            this.ox = this.x
            this.oy = this.y
            this.x += clamp(vx, -maxV, maxV)
            this.y += clamp(vy, -maxV, maxV) + gravity * dt * dt
        }
        applyForce(fx, fy) {
            const mag = Math.sqrt(fx * fx + fy * fy)
            const maxF = 8
            if (mag > maxF) { fx *= maxF / mag; fy *= maxF / mag }
            this.x += fx; this.y += fy
        }
    }

    // ========== 弹簧 ==========
    class Spring {
        constructor(a, b, stiffness = 0.08, nonLin = 0.0002) {
            this.a = a; this.b = b
            this.stiffness = stiffness
            this.nonLin = nonLin
            this.rest = Math.max(0.1, this.dist())
        }
        dist() {
            const dx = this.b.x - this.a.x, dy = this.b.y - this.a.y
            return Math.sqrt(dx * dx + dy * dy)
        }
        update() {
            const dx = this.b.x - this.a.x, dy = this.b.y - this.a.y
            const d = Math.max(0.001, Math.sqrt(dx * dx + dy * dy))
            const stretch = clamp(d - this.rest, -this.rest * 2, this.rest * 2)
            // F = k(x + bx³) 非线性弹簧
            const f = this.stiffness * (stretch + this.nonLin * stretch * stretch * stretch)
            const nx = dx / d, ny = dy / d
            this.a.applyForce(nx * f, ny * f)
            this.b.applyForce(-nx * f, -ny * f)
        }
        draw(ctx) {
            ctx.beginPath()
            ctx.moveTo(this.a.x, this.a.y)
            ctx.lineTo(this.b.x, this.b.y)
            ctx.strokeStyle = 'rgba(79,70,229,.3)'
            ctx.stroke()
        }
    }

    // ========== 平台 ==========
    class Platform {
        constructor(x, y, w, h, color = '#8B4513') {
            this.x = x; this.y = y; this.w = w; this.h = h; this.color = color
        }
        draw(ctx) {
            ctx.fillStyle = this.color
            ctx.fillRect(this.x, this.y, this.w, this.h)
            // 砖纹
            ctx.fillStyle = 'rgba(0,0,0,.1)'
            for (let i = 0; i < this.w; i += 20) ctx.fillRect(this.x + i, this.y, 10, this.h)
        }
        collide(p) {
            if (p.x > this.x && p.x < this.x + this.w &&
                p.y + p.r > this.y && p.y - p.r < this.y + this.h) {
                if (p.oy + p.r <= this.y) { // 从上方
                    p.y = this.y - p.r; p.oy = p.y; p.onGround = true
                } else if (p.oy - p.r >= this.y + this.h) { // 从下方
                    p.y = this.y + this.h + p.r; p.oy = p.y
                } else if (p.ox + p.r <= this.x) {
                    p.x = this.x - p.r; p.ox = p.x
                } else if (p.ox - p.r >= this.x + this.w) {
                    p.x = this.x + this.w + p.r; p.ox = p.x
                }
            }
        }
    }

    // ========== 星星 ==========
    class Star {
        constructor(x, y) {
            this.x = x; this.y = y; this.r = 12
            this.collected = false; this.pulse = 0
        }
        update() { this.pulse = (this.pulse + 0.05) % (Math.PI * 2) }
        draw(ctx) {
            if (this.collected) return
            const sz = this.r * (1 + Math.sin(this.pulse) * 0.2)
            ctx.save(); ctx.translate(this.x, this.y)
            // 五角星
            ctx.fillStyle = '#FFD700'; ctx.beginPath()
            for (let i = 0; i < 5; i++) {
                const a = (i * 72 - 90) * Math.PI / 180
                const ia = (i * 72 + 36 - 90) * Math.PI / 180
                if (i === 0) ctx.moveTo(Math.cos(a) * sz, Math.sin(a) * sz)
                else ctx.lineTo(Math.cos(a) * sz, Math.sin(a) * sz)
                ctx.lineTo(Math.cos(ia) * sz * 0.4, Math.sin(ia) * sz * 0.4)
            }
            ctx.closePath(); ctx.fill()
            // 光晕
            ctx.fillStyle = 'rgba(255,215,0,.3)'
            ctx.beginPath(); ctx.arc(0, 0, sz * 1.2, 0, Math.PI * 2); ctx.fill()
            ctx.restore()
        }
        tryCollect(particles) {
            if (this.collected) return false
            for (const p of particles) {
                const dx = p.x - this.x, dy = p.y - this.y
                if (dx * dx + dy * dy < (this.r + p.r) * (this.r + p.r)) {
                    this.collected = true; return true
                }
            }
            return false
        }
    }

    // ========== 游戏主体 ==========
    class JellyMario {
        constructor(canvasId) {
            this.canvas = document.getElementById(canvasId)
            this.ctx = this.canvas.getContext('2d')
            this.resize()
            window.addEventListener('resize', () => this.resize())

            this.score = 0
            this.debug = false
            this.keys = { left: false, right: false, jump: false }
            this.camX = 0 // 摄像机偏移

            // 物理参数——UI 控件的默认值也会同步到这里
            this.P = {
                stiffness: 0.08, gravity: 0.06, jumpStrength: 12,
                damping: 0.005, surfaceTension: 0.001, nonLin: 0.09,
                pRadius: 12, grid: 6, moveForce: 0.08, maxSpd: 3,
            }

            this.particles = []; this.springs = []
            this.platforms = []; this.stars = []

            this.init()
            this.bindKeys()
            this.bindControls()
            this.lastT = 0
            requestAnimationFrame(t => this.loop(t))
        }

        resize() {
            const { width, height } = this.canvas.getBoundingClientRect()
            this.canvas.width = Math.max(100, width | 0)
            this.canvas.height = Math.max(100, height | 0)
        }

        // ---- 初始化关卡 ----
        init() {
            this.particles = []; this.springs = []
            this.platforms = []; this.stars = []
            this.score = 0
            document.getElementById('score').textContent = 'Score: 0'

            const W = this.canvas.width, H = this.canvas.height
            const G = this.P.grid, R = this.P.pRadius

            // 果冻质点网格
            const sx = W / 4, sy = H / 2
            for (let y = 0; y < G; y++)
                for (let x = 0; x < G; x++)
                    this.particles.push(new Particle(sx + x * R * 1.5, sy + y * R * 1.5))

            // 弹簧连接（横、纵、对角）
            const idx = (x, y) => y * G + x
            for (let y = 0; y < G; y++) {
                for (let x = 0; x < G; x++) {
                    const i = idx(x, y)
                    if (x < G - 1) this.springs.push(new Spring(this.particles[i], this.particles[idx(x + 1, y)], this.P.stiffness, this.P.nonLin))
                    if (y < G - 1) this.springs.push(new Spring(this.particles[i], this.particles[idx(x, y + 1)], this.P.stiffness, this.P.nonLin))
                    if (x < G - 1 && y < G - 1) this.springs.push(new Spring(this.particles[i], this.particles[idx(x + 1, y + 1)], this.P.stiffness * 0.7, this.P.nonLin))
                    if (x < G - 1 && y > 0) this.springs.push(new Spring(this.particles[i], this.particles[idx(x + 1, y - 1)], this.P.stiffness * 0.7, this.P.nonLin))
                }
            }

            // 地面 + 平台
            const ground = new Platform(0, H - 40, W * 3, 40, '#4CAF50')
            this.platforms = [
                ground,
                new Platform(W * .5, H * .7, 100, 20),
                new Platform(W * .8, H * .5, 100, 20),
                new Platform(W * 1.2, H * .6, 100, 20),
                new Platform(W * 1.5, H * .4, 100, 20),
                new Platform(W * 1.8, H * .7, 100, 20),
                new Platform(W * 2.2, H * .5, 100, 20),
            ]

            // 星星
            ;[.6, .9, 1.3, 1.6, 2.0, 2.3].forEach((mx, i) => {
                this.stars.push(new Star(W * mx, H * [.6, .4, .5, .3, .6, .4][i]))
            })
        }

        // ---- 质心 ----
        getCenter() {
            let cx = 0, cy = 0
            for (const p of this.particles) { cx += p.x; cy += p.y }
            const n = this.particles.length
            return { x: cx / n, y: cy / n }
        }

        // ---- 物理更新 ----
        step(dt) {
            // Verlet 积分
            for (const p of this.particles) p.update(dt, this.P.gravity, this.P.damping)

            // 弹簧迭代 5 次保持稳定
            for (let i = 0; i < 5; i++) for (const s of this.springs) s.update()

            // 表面张力
            if (this.P.surfaceTension > 0) {
                const R3 = this.P.pRadius * 3
                for (let i = 0; i < this.particles.length; i++) {
                    const p = this.particles[i]
                    let cnt = 0, ax = 0, ay = 0
                    for (let j = 0; j < this.particles.length; j++) {
                        if (i === j) continue
                        const q = this.particles[j]
                        const dx = q.x - p.x, dy = q.y - p.y
                        const d = Math.sqrt(dx * dx + dy * dy)
                        if (d < R3 && d > 0.1) { cnt++; ax += q.x; ay += q.y }
                    }
                    if (cnt > 0) p.applyForce((ax / cnt - p.x) * this.P.surfaceTension, (ay / cnt - p.y) * this.P.surfaceTension)
                }
            }

            // 玩家控制
            this.applyControls()

            // 碰撞
            for (const p of this.particles) for (const pl of this.platforms) pl.collide(p)

            // 星星收集
            for (const s of this.stars) {
                if (s.tryCollect(this.particles)) {
                    this.score += 10
                    document.getElementById('score').textContent = `Score: ${this.score}`
                }
                s.update()
            }

            // 摄像机跟随
            const { x: cx } = this.getCenter()
            const target = cx - this.canvas.width / 3
            this.camX += (target - this.camX) * 0.1
        }

        applyControls() {
            const { x: cx, y: cy } = this.getCenter()
            let anyGround = false
            for (const p of this.particles) { if (p.onGround) anyGround = true; p.onGround = false }

            const mf = this.P.moveForce
            if (this.keys.left) for (const p of this.particles) p.applyForce(-mf * (1 + (p.x - cx) / 100), 0)
            if (this.keys.right) for (const p of this.particles) p.applyForce(mf * (1 + (cx - p.x) / 100), 0)

            if (this.keys.jump && anyGround) {
                for (const p of this.particles) p.applyForce(0, -this.P.jumpStrength * (1 + (cy - p.y) / 50))
                this.keys.jump = false
            }

            // 空中微调
            if (!anyGround) {
                if (this.keys.left) for (const p of this.particles) p.applyForce(-mf * 0.3, 0)
                if (this.keys.right) for (const p of this.particles) p.applyForce(mf * 0.3, 0)
            }

            // 限速
            for (const p of this.particles) {
                const vx = p.x - p.ox
                if (vx > this.P.maxSpd) p.x = p.ox + this.P.maxSpd
                else if (vx < -this.P.maxSpd) p.x = p.ox - this.P.maxSpd
            }
        }

        // ---- 绘制 ----
        draw() {
            const ctx = this.ctx, W = this.canvas.width, H = this.canvas.height

            // 天空
            const sky = ctx.createLinearGradient(0, 0, 0, H)
            sky.addColorStop(0, '#87CEEB'); sky.addColorStop(1, '#E0F7FA')
            ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H)

            // 太阳
            ctx.fillStyle = '#FFD700'
            ctx.beginPath(); ctx.arc(W - 60, 60, 40, 0, Math.PI * 2); ctx.fill()

            // 云
            this.drawCloud(100, 50, 100)
            this.drawCloud(300 - this.camX % 500, 80, 80)
            this.drawCloud(600 - this.camX % 700, 40, 120)

            // 平台 & 星星（带摄像机偏移）
            ctx.save(); ctx.translate(-this.camX, 0)
            for (const pl of this.platforms) pl.draw(ctx)
            for (const s of this.stars) s.draw(ctx)
            ctx.restore()

            // 果冻本体
            this.drawJelly()

            // 调试信息
            if (this.debug) this.drawDebug()
        }

        drawCloud(x, y, sz) {
            const ctx = this.ctx
            ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath()
            ctx.arc(x, y, sz * .3, 0, Math.PI * 2)
            ctx.arc(x + sz * .2, y - sz * .1, sz * .25, 0, Math.PI * 2)
            ctx.arc(x + sz * .4, y, sz * .3, 0, Math.PI * 2)
            ctx.arc(x + sz * .1, y + sz * .1, sz * .2, 0, Math.PI * 2)
            ctx.arc(x + sz * .35, y + sz * .1, sz * .25, 0, Math.PI * 2)
            ctx.fill()
        }

        drawJelly() {
            const ctx = this.ctx, G = this.P.grid, ps = this.particles
            const { x: cx, y: cy } = this.getCenter()

            // 渐变填充
            const grad = ctx.createLinearGradient(cx - 30, cy - 30, cx + 30, cy + 30)
            grad.addColorStop(0, 'rgba(79,70,229,.9)')
            grad.addColorStop(1, 'rgba(236,72,153,.8)')

            // 三角网格填充
            ctx.beginPath()
            for (let y = 0; y < G - 1; y++) {
                for (let x = 0; x < G - 1; x++) {
                    const p1 = ps[y * G + x], p2 = ps[y * G + x + 1]
                    const p3 = ps[(y + 1) * G + x + 1], p4 = ps[(y + 1) * G + x]
                    ctx.moveTo(p1.x - this.camX, p1.y); ctx.lineTo(p2.x - this.camX, p2.y); ctx.lineTo(p3.x - this.camX, p3.y); ctx.closePath()
                    ctx.moveTo(p1.x - this.camX, p1.y); ctx.lineTo(p3.x - this.camX, p3.y); ctx.lineTo(p4.x - this.camX, p4.y); ctx.closePath()
                }
            }
            ctx.fillStyle = grad; ctx.fill()

            // 高光（上半部分）
            ctx.beginPath()
            for (let y = 0; y < G / 2; y++) {
                for (let x = 0; x < G - 1; x++) {
                    const p1 = ps[y * G + x], p2 = ps[y * G + x + 1]
                    const p3 = ps[(y + 1) * G + x + 1], p4 = ps[(y + 1) * G + x]
                    ctx.moveTo(p1.x - this.camX, p1.y); ctx.lineTo(p2.x - this.camX, p2.y); ctx.lineTo(p3.x - this.camX, p3.y); ctx.closePath()
                    ctx.moveTo(p1.x - this.camX, p1.y); ctx.lineTo(p3.x - this.camX, p3.y); ctx.lineTo(p4.x - this.camX, p4.y); ctx.closePath()
                }
            }
            ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill()

            // 轮廓线
            ctx.beginPath()
            for (let x = 0; x < G - 1; x++) { // top
                if (x === 0) ctx.moveTo(ps[x].x - this.camX, ps[x].y)
                ctx.lineTo(ps[x + 1].x - this.camX, ps[x + 1].y)
            }
            for (let y = 0; y < G - 1; y++) ctx.lineTo(ps[(y + 1) * G + G - 1].x - this.camX, ps[(y + 1) * G + G - 1].y) // right
            for (let x = G - 1; x > 0; x--) ctx.lineTo(ps[(G - 1) * G + x - 1].x - this.camX, ps[(G - 1) * G + x - 1].y) // bottom
            for (let y = G - 1; y > 0; y--) ctx.lineTo(ps[(y - 1) * G].x - this.camX, ps[(y - 1) * G].y) // left
            ctx.closePath()
            ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.stroke()

            // 眼睛
            let lookX = this.keys.right ? 1 : this.keys.left ? -1 : 0
            const lx = cx - 15 + lookX * 5 - this.camX, rx = cx + 5 + lookX * 5 - this.camX, ey = cy - 10
            ctx.fillStyle = '#fff'; ctx.beginPath()
            ctx.arc(lx, ey, 8, 0, Math.PI * 2); ctx.arc(rx, ey, 8, 0, Math.PI * 2); ctx.fill()
            ctx.fillStyle = '#000'; ctx.beginPath()
            ctx.arc(lx + lookX * 3, ey, 4, 0, Math.PI * 2); ctx.arc(rx + lookX * 3, ey, 4, 0, Math.PI * 2); ctx.fill()
        }

        drawDebug() {
            const ctx = this.ctx, { x: cx, y: cy } = this.getCenter()
            ctx.fillStyle = '#000'; ctx.font = '12px monospace'
            ctx.fillText(`pos: (${cx | 0}, ${cy | 0})`, 10, 20)
            const vx = this.particles[0].x - this.particles[0].ox
            ctx.fillText(`vx: ${(vx * 100 | 0) / 100}`, 10, 36)

            ctx.save(); ctx.translate(-this.camX, 0)
            for (const p of this.particles) {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2)
                ctx.fillStyle = 'rgba(79,70,229,.5)'; ctx.fill()
            }
            for (const s of this.springs) s.draw(ctx)
            ctx.restore()
        }

        // ---- 主循环 ----
        loop(t) {
            const dt = Math.max(1, Math.min(100, t - this.lastT))
            this.lastT = t
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height)
            this.step(dt / 16)
            this.draw()
            requestAnimationFrame(t => this.loop(t))
        }

        // ---- 键盘绑定 ----
        bindKeys() {
            const map = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' }
            const jumpKeys = new Set(['ArrowUp', ' ', 'w', 'W'])
            window.addEventListener('keydown', e => {
                if (map[e.key]) this.keys[map[e.key]] = true
                if (jumpKeys.has(e.key)) this.keys.jump = true
            })
            window.addEventListener('keyup', e => {
                if (map[e.key]) this.keys[map[e.key]] = false
            })
        }

        // ---- 手机虚拟按键 ----
        bindTouch() {
            const bind = (id, onDown, onUp) => {
                const el = document.getElementById(id)
                if (!el) return
                const down = e => { e.preventDefault(); el.classList.add('pressed'); onDown() }
                const up = e => { el.classList.remove('pressed'); onUp() }
                el.addEventListener('touchstart', down, { passive: false })
                el.addEventListener('touchend', up)
                el.addEventListener('touchcancel', up)
            }
            bind('pad-left',  () => this.keys.left = true,  () => this.keys.left = false)
            bind('pad-right', () => this.keys.right = true, () => this.keys.right = false)
            bind('pad-jump',  () => this.keys.jump = true,  () => {})
        }

        // ---- 控件绑定 ----
        bindControls() {
            const $ = id => document.getElementById(id)

            $('stiffness').addEventListener('input', e => {
                this.P.stiffness = +e.target.value
                for (const s of this.springs) s.stiffness = this.P.stiffness
            })
            $('gravity').addEventListener('input', e => { this.P.gravity = +e.target.value })
            $('jumpStrength').addEventListener('input', e => { this.P.jumpStrength = +e.target.value })
            $('resetGame').addEventListener('click', () => this.init())
            $('toggleDebug').addEventListener('click', () => { this.debug = !this.debug })
        }
    }

    // 启动
    const game = new JellyMario('gameCanvas')
    game.bindTouch()
    </script>
</body>
</html>
