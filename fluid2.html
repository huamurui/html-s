<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fluid No.2 · 流体实验室</title>
  <meta name="description" content="单文件交互式二维 Navier-Stokes 流体物理实验室：WebGL2 实时涡量与压力投影、障碍物风洞、热浮力羽流、宣纸墨韵与物理场可视化。" />
  <style>
    :root {
      --hud-bg: rgba(14, 17, 24, 0.72);
      --hud-bg-strong: rgba(16, 20, 29, 0.88);
      --hud-border: rgba(255, 255, 255, 0.13);
      --hud-border-strong: rgba(255, 255, 255, 0.24);
      --hud-ink: #eef2f7;
      --hud-mute: #9aa6b8;
      --hud-pill: rgba(255, 255, 255, 0.06);
      --hud-pill-hover: rgba(255, 255, 255, 0.14);
      --accent: #38bdf8;
      --accent-ink: #07131d;
      --danger: #f43f5e;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      --sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color-scheme: dark;
    }

    body[data-ui-theme="light"] {
      --hud-bg: rgba(243, 239, 230, 0.80);
      --hud-bg-strong: rgba(247, 243, 235, 0.94);
      --hud-border: rgba(23, 23, 23, 0.15);
      --hud-border-strong: rgba(23, 23, 23, 0.34);
      --hud-ink: #171717;
      --hud-mute: #645f55;
      --hud-pill: rgba(23, 23, 23, 0.05);
      --hud-pill-hover: rgba(23, 23, 23, 0.11);
      --accent: #c93b2b;
      --accent-ink: #faf7f0;
      --danger: #b91c1c;
      --shadow: 0 12px 32px rgba(28, 24, 18, 0.14);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06080d;
      font-family: var(--sans);
      color: var(--hud-ink);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body[data-ui-theme="light"] { background: #f3efe6; }

    #fluid {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    button, input {
      font: inherit;
      color: inherit;
    }
    button { cursor: pointer; }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- Top-Left Badge ---------- */
    .hud-badge {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease, background 0.25s ease, border-color 0.25s ease;
    }
    .badge-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      flex: none;
    }
    .badge-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--hud-mute);
      letter-spacing: 0.03em;
    }
    .badge-hint {
      font-size: 11.5px;
      color: var(--hud-mute);
      transition: opacity 0.6s ease;
    }
    .badge-hint.dimmed {
      opacity: 0.52;
    }

    /* ---------- Bottom Dock ---------- */
    .dock {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
      padding: 6px 8px;
      border-radius: 16px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow-x: auto;
      scrollbar-width: none;
      transition: opacity 0.28s ease, transform 0.28s ease, background 0.25s ease, border-color 0.25s ease;
    }
    .dock::-webkit-scrollbar { display: none; }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px;
      border-radius: 11px;
      background: var(--hud-pill);
      border: 1px solid var(--hud-border);
      flex: none;
    }
    .dock-sep {
      width: 1px;
      height: 20px;
      background: var(--hud-border);
      flex: none;
    }
    .pill-btn {
      height: 30px;
      padding: 0 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--hud-mute);
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }
    .pill-btn:hover {
      background: var(--hud-pill-hover);
      color: var(--hud-ink);
    }
    .pill-btn:active { transform: scale(0.97); }
    .pill-btn[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }

    .act-btn {
      height: 32px;
      padding: 0 11px;
      border-radius: 10px;
      border: 1px solid var(--hud-border);
      background: var(--hud-pill);
      color: var(--hud-ink);
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .act-btn:hover {
      background: var(--hud-pill-hover);
      border-color: var(--hud-border-strong);
    }
    .act-btn:active { transform: scale(0.97); }
    .act-btn[aria-expanded="true"],
    .act-btn[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }

    /* ---------- Right Inspector Drawer ---------- */
    .drawer {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      bottom: 78px;
      width: min(312px, calc(100vw - 28px));
      z-index: 30;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      background: var(--hud-bg-strong);
      border: 1px solid var(--hud-border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateX(calc(100% + 28px));
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease, background 0.25s ease, border-color 0.25s ease;
    }
    .drawer.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--hud-border);
      flex: none;
    }
    .drawer-head h2 {
      margin: 0;
      font-size: 13px;
      font-family: var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .close-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--hud-border);
      background: var(--hud-pill);
      display: grid;
      place-items: center;
      font-size: 15px;
      line-height: 1;
    }
    .close-btn:hover { background: var(--hud-pill-hover); }

    .drawer-body {
      padding: 14px 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .section-label {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--hud-mute);
      margin-bottom: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .choice-btn {
      height: 32px;
      padding: 0 8px;
      border-radius: 9px;
      border: 1px solid var(--hud-border);
      background: var(--hud-pill);
      color: var(--hud-ink);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .choice-btn:hover {
      background: var(--hud-pill-hover);
      border-color: var(--hud-border-strong);
    }
    .choice-btn[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }
    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .sliders {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
    }
    .slider-head label { color: var(--hud-ink); }
    .slider-head output {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--hud-mute);
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: transparent;
      margin: 0;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 999px;
      background: var(--hud-border-strong);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -5px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--hud-bg-strong);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    input[type="range"]::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background: var(--hud-border-strong);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--hud-bg-strong);
    }

    .switches {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }
    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--hud-border-strong);
      background: var(--hud-pill);
      padding: 0;
      transition: background 0.18s ease, border-color 0.18s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--hud-ink);
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .switch[aria-checked="true"] {
      background: var(--accent);
      border-color: var(--accent);
    }
    .switch[aria-checked="true"]::after {
      transform: translateX(16px);
      background: var(--accent-ink);
    }

    .danger-btn {
      width: 100%;
      height: 32px;
      border-radius: 9px;
      border: 1px solid rgba(244, 63, 94, 0.35);
      background: rgba(244, 63, 94, 0.10);
      color: var(--danger);
      font-size: 12.5px;
      font-weight: 500;
    }
    .danger-btn:hover { background: rgba(244, 63, 94, 0.18); }

    .shortcuts {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--hud-mute);
      line-height: 1.7;
      border-top: 1px solid var(--hud-border);
      padding-top: 10px;
    }
    kbd {
      display: inline-block;
      padding: 0 5px;
      border-radius: 4px;
      border: 1px solid var(--hud-border-strong);
      background: var(--hud-pill);
      color: var(--hud-ink);
      font-size: 10.5px;
    }

    /* ---------- Toast & Hidden HUD State ---------- */
    .toast {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -12px);
      z-index: 40;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--hud-bg-strong);
      border: 1px solid var(--hud-border);
      backdrop-filter: blur(14px);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body.hud-hidden .hud-badge,
    body.hud-hidden .dock,
    body.hud-hidden .drawer {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(14px);
    }
    body.hud-hidden .dock {
      transform: translate(-50%, 20px);
    }
  </style>
</head>
<body>
  <canvas id="fluid" aria-label="交互式二维流体画布"></canvas>

  <header class="hud-badge" id="hud-badge">
    <div class="badge-top">
      <span class="badge-dot" aria-hidden="true"></span>
      <span class="badge-title">Fluid No.2</span>
      <span class="badge-meta" id="telemetry">60 FPS · Init…</span>
    </div>
    <div class="badge-hint" id="badge-hint">拖拽搅动流体 · 右键绘制障碍 · Space 爆发 · H 隐藏界面</div>
  </header>

  <nav class="dock" aria-label="流体控制栏">
    <div class="dock-group" role="group" aria-label="物理场景">
      <button class="pill-btn" data-scenario="free" aria-pressed="true">自由流体</button>
      <button class="pill-btn" data-scenario="wind" aria-pressed="false">风洞涡街</button>
      <button class="pill-btn" data-scenario="thermal" aria-pressed="false">热羽流</button>
      <button class="pill-btn" data-scenario="clash" aria-pressed="false">双涡对撞</button>
    </div>

    <div class="dock-sep" aria-hidden="true"></div>

    <div class="dock-group" role="group" aria-label="交互工具">
      <button class="pill-btn" data-tool="stir" aria-pressed="true">搅动</button>
      <button class="pill-btn" data-tool="wall" aria-pressed="false">画障碍</button>
      <button class="pill-btn" data-tool="erase" aria-pressed="false">擦障碍</button>
    </div>

    <div class="dock-sep" aria-hidden="true"></div>

    <button class="act-btn" id="btn-burst" title="随机爆发 (Space)">爆发</button>
    <button class="act-btn" id="btn-pause" aria-pressed="false" title="暂停/继续 (P)">暂停</button>
    <button class="act-btn" id="btn-clear" title="清空流体 (C)">清空</button>
    <button class="act-btn" id="btn-shot" title="导出截图 (S)">截图</button>
    <button class="act-btn" id="btn-drawer" aria-expanded="false" aria-controls="inspector" title="参数面板 (I)">参数</button>
  </nav>

  <aside class="drawer" id="inspector" aria-label="流体物理参数面板">
    <div class="drawer-head">
      <h2>Inspector · 参数</h2>
      <button class="close-btn" id="btn-close-drawer" aria-label="关闭参数面板">×</button>
    </div>

    <div class="drawer-body">
      <div>
        <div class="section-label">材质主题 · Theme</div>
        <div class="grid-2">
          <button class="choice-btn" data-theme="iridescent" aria-pressed="true">
            <span class="swatch" style="background: linear-gradient(135deg,#38bdf8,#c084fc);"></span>极光油膜
          </button>
          <button class="choice-btn" data-theme="sumie" aria-pressed="false">
            <span class="swatch" style="background: linear-gradient(135deg,#171717,#c93b2b); border-color: rgba(0,0,0,0.3);"></span>宣纸墨韵
          </button>
          <button class="choice-btn" data-theme="ember" aria-pressed="false">
            <span class="swatch" style="background: linear-gradient(135deg,#fb923c,#ef4444);"></span>焰火余烬
          </button>
          <button class="choice-btn" data-theme="abyss" aria-pressed="false">
            <span class="swatch" style="background: linear-gradient(135deg,#2dd4bf,#3b82f6);"></span>深海荧光
          </button>
        </div>
      </div>

      <div>
        <div class="section-label">物理场视图 · Field</div>
        <div class="grid-3">
          <button class="choice-btn" data-field="0" aria-pressed="true">染料</button>
          <button class="choice-btn" data-field="1" aria-pressed="false">流速</button>
          <button class="choice-btn" data-field="2" aria-pressed="false">涡量</button>
        </div>
      </div>

      <div>
        <div class="section-label">动力学参数 · Physics</div>
        <div class="sliders">
          <div class="slider-row">
            <div class="slider-head">
              <label for="sl-vorticity">涡量约束 Vorticity</label>
              <output id="out-vorticity" for="sl-vorticity">28</output>
            </div>
            <input id="sl-vorticity" type="range" min="0" max="50" step="1" value="28" />
          </div>
          <div class="slider-row">
            <div class="slider-head">
              <label for="sl-vel-diss">速度衰减 Vel Dissipation</label>
              <output id="out-vel-diss" for="sl-vel-diss">0.35</output>
            </div>
            <input id="sl-vel-diss" type="range" min="0" max="3" step="0.05" value="0.35" />
          </div>
          <div class="slider-row">
            <div class="slider-head">
              <label for="sl-dye-diss">染料衰减 Dye Dissipation</label>
              <output id="out-dye-diss" for="sl-dye-diss">0.50</output>
            </div>
            <input id="sl-dye-diss" type="range" min="0" max="3" step="0.05" value="0.50" />
          </div>
          <div class="slider-row">
            <div class="slider-head">
              <label for="sl-radius">笔刷半径 Brush Radius</label>
              <output id="out-radius" for="sl-radius">0.22</output>
            </div>
            <input id="sl-radius" type="range" min="0.06" max="0.70" step="0.02" value="0.22" />
          </div>
          <div class="slider-row">
            <div class="slider-head">
              <label for="sl-iters">压力迭代 Pressure Iters</label>
              <output id="out-iters" for="sl-iters">20</output>
            </div>
            <input id="sl-iters" type="range" min="8" max="40" step="2" value="20" />
          </div>
          <div class="slider-row">
            <div class="slider-head">
              <label for="sl-buoyancy">热浮力 Buoyancy</label>
              <output id="out-buoyancy" for="sl-buoyancy">0.0</output>
            </div>
            <input id="sl-buoyancy" type="range" min="-2.0" max="4.0" step="0.1" value="0.0" />
          </div>
        </div>
      </div>

      <div>
        <div class="section-label">渲染开关 · Rendering</div>
        <div class="switches">
          <div class="switch-row">
            <span>液面高光 Specular</span>
            <button class="switch" id="sw-specular" role="switch" aria-checked="true"></button>
          </div>
          <div class="switch-row">
            <span>柔光辉光 Bloom</span>
            <button class="switch" id="sw-bloom" role="switch" aria-checked="true"></button>
          </div>
          <div class="switch-row">
            <span>自动搅动 Auto Swirl</span>
            <button class="switch" id="sw-auto" role="switch" aria-checked="false"></button>
          </div>
        </div>
      </div>

      <button class="danger-btn" id="btn-clear-obs">清除全部障碍物</button>

      <div class="shortcuts">
        <kbd>1</kbd>-<kbd>4</kbd> 切换场景 · <kbd>Space</kbd> 爆发 · <kbd>P</kbd> 暂停<br />
        <kbd>C</kbd> 清空 · <kbd>S</kbd> 截图 · <kbd>I</kbd> 参数 · <kbd>H</kbd> 隐藏 HUD<br />
        左键搅动 · 右键画墙 · Shift+右键擦墙
      </div>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      /* =========================================================
       * Configuration & Palettes
       * ========================================================= */
      const THEMES = {
        iridescent: {
          ui: "dark",
          lightPaper: false,
          bg: [0.024, 0.031, 0.052],
          specular: true,
          bloom: true,
          colors: [
            [0.12, 0.72, 1.00],
            [0.68, 0.25, 0.98],
            [0.10, 0.92, 0.76],
            [0.98, 0.35, 0.62],

      const state = {

        vorticity: 28,
