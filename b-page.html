    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      #playground {
        min-height: 100vh;
        min-height: 100dvh;
        font: 14px/1.6 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #372d52;
      }
      .menu__column {
        position: fixed;
        width: 200px;
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);
        max-height: calc(100dvh - 16px);
        overflow-y: auto;
        padding: 4px;
        border: 1px solid #e6d4bc;
        border-radius: 7px;
        background: #fff6e8;
        box-shadow: 0 4px 14px #57452e20;
        scrollbar-width: thin;
        animation: appear 120ms ease-out;
      }
      .menu__start { left: 8px; top: 8px; }
      .menu__item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 5px 8px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        overflow-wrap: anywhere;
        cursor: pointer;
      }
      .menu__item--on-path, .menu__item:hover { background: #eaf2f5; }
      .menu__item:focus-visible { outline: 2px solid #91a5b4; outline-offset: -2px; }
      .menu__icon { flex-shrink: 0; color: #9d8d78; }
      @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .menu__column { animation: none; } }
    </style>

      const playground = document.getElementById("playground")
      const start = document.getElementById("start")
      const menus = []

      // Each array entry is one open level; switching a branch removes all later levels.
      function closeMenus(from = 0) {
        menus.splice(from).reverse().forEach(({ element, trigger }) => {
          element.remove()
          trigger.classList.remove("menu__item--on-path")
          trigger.setAttribute("aria-expanded", "false")
        })
      }

      function positionMenu(menu, trigger) {
        const margin = 8
        const gap = 4
        const anchor = trigger.getBoundingClientRect()
        const { width, height } = menu.getBoundingClientRect()
        let x = anchor.right + gap
        let y = anchor.top
        if (x + width > window.innerWidth - margin) x = anchor.left - width - gap
        // If two columns cannot fit side by side, open below the trigger.
        if (x < margin) {
          x = anchor.left
          y = anchor.bottom + gap
        }
        menu.style.left = `${Math.max(margin, Math.min(x, window.innerWidth - width - margin))}px`
        menu.style.top = `${Math.max(margin, Math.min(y, window.innerHeight - height - margin))}px`
      }

      function openMenu(node, trigger, depth) {
        if (menus[depth]?.node === node) return
        closeMenus(depth)
        if (!node.children?.length) return

        const menu = document.createElement("div")
        menu.className = "menu__column"
        menu.style.zIndex = depth + 1
        node.children.forEach((child) => {
          const item = document.createElement("button")
          item.className = "menu__item"
          item.dataset.name = child.name
          const text = document.createElement("span")
          text.textContent = child.content
          item.appendChild(text)
          if (child.children?.length) {
            item.setAttribute("aria-expanded", "false")
            const arrow = document.createElement("span")
            arrow.className = "menu__icon"
            arrow.setAttribute("aria-hidden", "true")
            arrow.textContent = "›"
            item.appendChild(arrow)
          }
          item.addEventListener("pointerenter", (event) => {
            if (event.pointerType === "mouse") openMenu(child, item, depth + 1)
          })
          item.addEventListener("click", () => openMenu(child, item, depth + 1))
          item.addEventListener("keydown", (event) => {
            const siblings = [...menu.children]
            const index = siblings.indexOf(item)
            if (event.key === "ArrowDown" || event.key === "ArrowUp") {
              event.preventDefault()
              const step = event.key === "ArrowDown" ? 1 : -1
              siblings[(index + step + siblings.length) % siblings.length].focus()
            } else if (event.key === "ArrowRight" && child.children?.length) {
              event.preventDefault()
              openMenu(child, item, depth + 1)
              menus[depth + 1].element.firstElementChild.focus()
            } else if (event.key === "ArrowLeft") {
              event.preventDefault()
              closeMenus(depth)
              trigger.focus()
            }
          })
          menu.appendChild(item)
        })
        playground.appendChild(menu)
        menus.push({ node, element: menu, trigger })
        trigger.classList.add("menu__item--on-path")
        trigger.setAttribute("aria-expanded", "true")
        positionMenu(menu, trigger)
        // Scrolling a parent invalidates the positions of its descendants.
        menu.addEventListener("scroll", () => closeMenus(depth + 1), { passive: true })
      }

      start.addEventListener("click", () => {
        if (menus.length) closeMenus()
        else openMenu(article[0], start, 0)
      })
      start.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "ArrowRight") {
          event.preventDefault()
          openMenu(article[0], start, 0)
          menus[0].element.firstElementChild.focus()
        }
      })
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".menu__column")) closeMenus()
      })
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && menus.length) {
          event.preventDefault()
          const trigger = menus.at(-1).trigger
          closeMenus(menus.length - 1)
          trigger.focus()
        }
      })
      window.addEventListener("resize", () => {
        const restoreFocus = menus.some(({ element }) => element.contains(document.activeElement))
        closeMenus()
        if (restoreFocus) start.focus()
      })
